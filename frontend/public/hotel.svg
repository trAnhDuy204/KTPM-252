<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Main building body -->
  <rect x="15" y="35" width="70" height="55" rx="2" fill="#D4A017"/>
  <!-- Roof / triangular top -->
  <polygon points="50,10 5,38 95,38" fill="#C8940F"/>
  <!-- Door -->
  <rect x="40" y="65" width="20" height="25" rx="2" fill="#8B6500"/>
  <!-- Windows row 1 -->
  <rect x="22" y="45" width="12" height="12" rx="1" fill="#FFF5CC" opacity="0.9"/>
  <rect x="44" y="45" width="12" height="12" rx="1" fill="#FFF5CC" opacity="0.9"/>
  <rect x="66" y="45" width="12" height="12" rx="1" fill="#FFF5CC" opacity="0.9"/>
  <!-- Windows row 2 -->
  <rect x="22" y="62" width="12" height="12" rx="1" fill="#FFF5CC" opacity="0.9"/>
  <rect x="66" y="62" width="12" height="12" rx="1" fill="#FFF5CC" opacity="0.9"/>
  <!-- Door knob -->
  <circle cx="57" cy="79" r="1.5" fill="#D4A017"/>
  <!-- Flag pole -->
  <line x1="50" y1="10" x2="50" y2="2" stroke="#C8940F" stroke-width="2"/>
  <polygon points="50,2 60,5 50,8" fill="#D4A017"/>
</svg>
