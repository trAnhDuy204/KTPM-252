$kind: http-request
url: "{{baseUrl}}/api/reception/bookings/1/confirm"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Status is CONFIRMED', () => pm.expect(pm.response.json().status).to.eql('CONFIRMED'));
    language: text/javascript
order: 4000
