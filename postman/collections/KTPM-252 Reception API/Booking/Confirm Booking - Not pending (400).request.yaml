$kind: http-request
url: "{{baseUrl}}/api/reception/bookings/1/confirm"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Error message', () => pm.expect(pm.response.json().message).to.eql('Only PENDING bookings can be confirmed'));
    language: text/javascript
order: 5000
