$kind: http-request
description: Login as CUSTOMER first, then use that token here to test 403
url: "{{baseUrl}}/api/reception/bookings"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 18000
