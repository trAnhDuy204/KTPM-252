$kind: http-request
url: "{{baseUrl}}/api/reception/rooms"
method: POST
body:
  type: json
  content: |-
    {
        "hotelId": 1,
        "roomNumber": "101"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Validation error', () => pm.expect(pm.response.json().validationErrors.roomTypeId).to.eql('roomTypeId is required'));
    language: text/javascript
order: 3000
