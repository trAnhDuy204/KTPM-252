$kind: http-request
url: "{{baseUrl}}/api/reception/rooms/10"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Has room data', () => {
          var json = pm.response.json();
          pm.expect(json.id).to.be.a('number');
          pm.expect(json.hotelId).to.be.a('number');
          pm.expect(json.roomNumber).to.be.a('string');
          pm.expect(json.status).to.be.a('string');
      });
    language: text/javascript
order: 12000
