$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
body:
  type: json
  content: |-
    {
        "email": "rec@hotel.com",
        "password": "Password1"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          pm.collectionVariables.set('accessToken', pm.response.json().accessToken);
      }
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Has accessToken', () => pm.expect(pm.response.json().accessToken).to.be.a('string'));
    language: text/javascript
order: 1000
